services:
  - type: web
    name: motozap-sync
    runtime: node
    plan: free
    rootDir: MotoBoyApp
    buildCommand: "npm install --no-audit --no-fund && npx expo export --platform web"
    startCommand: "node server/sync.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CI
        value: "1"